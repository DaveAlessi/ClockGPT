name: Snyk + Gemini Auto-Fix

on:
  push:
    branches: [ os-fix-try ]
  workflow_dispatch: # Allows manual triggering

jobs:
  gemini-remediation:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Snyk & Gemini CLI
        run: |
          npm install -g snyk @google/gemini-cli
          gemini --install-plugin core-automation
          # Optional: Configure Snyk as a tool for Gemini using MCP
          npx -y snyk@latest mcp configure --tool=gemini-cli --rule-type=smart-apply

      - name: Run Snyk Scan
        id: snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          # Generate JSON report for Gemini to consume
          # We use '|| true' to prevent the action from stopping here
          snyk test . >> snyk_results.json || echo "HAS_VULNS=true" >> $GITHUB_ENV
      - name: 6. Configure Gemini Policy
        run: |
          # This bypasses the interactive trust prompts in the 2026 CLI sandbox
          mkdir -p ~/.gemini
          cat <<EOF > ~/.gemini/config.json
          {
            "remediation_mode": true,
            "trust_all_tools": true,
            "yolo": true,
            "allowed_commands": ["snyk *", "npm *", "git *"]
          }
          EOF
      - name: Gemini AI Fixer
        if: env.HAS_VULNS == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          # The -p flag passes the prompt. 
          # Gemini will read the JSON files and apply fixes.
          gemini --skip-trust -p "Analyze the security vulnerabilities in snyk_results.json.
                     1. Identify the files and lines causing high-severity issues.
                     2. Apply the minimum code changes required to fix these vulnerabilities.
                     3. For dependency issues, update the manifest file (e.g., package.json). And the first party code where needed.
                     4. After fixing, run 'snyk test .' again to verify. 
                     If the fix fails the scan or breaks the build, try a different approach."

      - name: Create Pull Request
        if: env.HAS_VULNS == 'true' || env.HAS_CODE_VULNS == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "security: Gemini-automated vulnerability remediation"
          title: "🚀 Gemini Security Fixes"
          body: |
            This PR was generated by Gemini CLI in response to a failed Snyk scan.
            
            **Changes applied:**
            - Fixed vulnerabilities identified in `snyk_results.json`
            - Updated dependencies/code to meet security standards.
            - Verified with a follow-up Snyk scan.
          branch: gemini-security-patch
